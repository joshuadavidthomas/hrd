name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./... -race

  goreleaser:
    name: Build release
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Publish the draft GitHub release and its assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA which is not on origin/main; refusing to release." >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run go vet
        run: go vet ./...

      - name: Check go.mod and go.sum
        run: go mod tidy -diff

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve release artifacts for attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/hrd.rb
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest and publish
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Publish the draft after attestation.
      id-token: write # Mint the OIDC token used to sign provenance.
      attestations: write # Store artifact attestations with GitHub.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Homebrew cask
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping Homebrew publication for $GITHUB_REF_NAME; latest release is $latest."
            exit 0
          fi
          endpoint="repos/joshuadavidthomas/homebrew-homebrew/contents/Casks/hrd.rb"
          sha_args=()
          if sha="$(gh api --method GET "$endpoint" -f ref=main --jq .sha 2>/dev/null)"; then
            sha_args=(-f "sha=$sha")
          fi
          content="$(base64 -w 0 dist/homebrew/Casks/hrd.rb)"
          gh api --method PUT "$endpoint" \
            -f branch=main \
            "${sha_args[@]}" \
            -f message="Update hrd cask for ${GITHUB_REF_NAME}" \
            -f content="$content"
