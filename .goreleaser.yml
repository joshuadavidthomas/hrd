version: 2

project_name: hrd

builds:
  - id: hrd
    main: ./cmd/hrd
    binary: hrd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/joshuadavidthomas/hrd/internal/version.Version={{ .Tag }}

archives:
  - id: hrd
    ids:
      - hrd
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - install.sh
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  draft: true

homebrew_casks:
  - name: hrd
    ids:
      - hrd
    binaries:
      - hrd
    repository:
      owner: joshuadavidthomas
      name: homebrew-homebrew
      branch: main
    skip_upload: true
    homepage: https://github.com/joshuadavidthomas/hrd
    description: "Manage local and sandboxed Herdr sessions"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
